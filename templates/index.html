<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resume Builder</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <aside class="panel form-panel">
        <div class="brand-row">
          <div>
            <p class="eyebrow">ATS Resume Builder</p>
            <h1>Build a resume</h1>
          </div>
          <button id="downloadBtn" class="primary-btn" type="button">PDF</button>
        </div>

        <section class="toolbar">
          <label>
            Template
            <select id="templateSelect">
              {% for template in templates %}
              <option value="{{ template.id }}" data-layout="{{ template.layout }}">{{ template.name }} - {{ template.layout }}</option>
              {% endfor %}
            </select>
          </label>
          <div class="grid two">
            <label>
              Search templates
              <input id="templateSearch" type="search" placeholder="timeline, sidebar, portfolio">
            </label>
            <label>
              Layout filter
              <select id="layoutFilter">
                <option value="">All layouts</option>
                <option value="single">Single</option>
                <option value="sidebar-left">Sidebar left</option>
                <option value="sidebar-right">Sidebar right</option>
                <option value="split">Split</option>
                <option value="timeline">Timeline</option>
                <option value="compact-grid">Compact grid</option>
              </select>
            </label>
          </div>
          <label>
            Target role
            <input id="targetRole" type="text" placeholder="Frontend Engineer">
          </label>
          <label>
            Keywords
            <input id="keywords" type="text" placeholder="React, APIs, accessibility">
          </label>
          <label>
            Job description
            <textarea id="jobDescription" rows="4" placeholder="Paste a job description for keyword gap analysis"></textarea>
          </label>
          <div class="action-row">
            <button id="analyzeBtn" class="secondary-btn compact" type="button">Analyze</button>
            <button id="exportBtn" class="secondary-btn compact" type="button">Export JSON</button>
            <label class="secondary-btn compact import-btn">
              Import JSON
              <input id="importJson" type="file" accept="application/json">
            </label>
          </div>
        </section>

        <section class="template-gallery">
          <div class="section-title-row">
            <h2>Template styles</h2>
            <span>120 layouts</span>
          </div>
          <div id="templateGallery" class="template-grid" aria-label="Resume template gallery">
            {% for template in templates %}
            <button
              class="template-card"
              type="button"
              data-template-id="{{ template.id }}"
              data-layout="{{ template.layout }}"
              style="--accent: {{ template.accent }}; --muted-bg: {{ template.muted }};"
            >
              <span class="mini-resume mini-{{ template.layout }} mini-{{ template.header_style }} mini-{{ template.ornament }}">
                {% if template.image_placement != "none" and template.photo_style != "none" %}
                <i class="mini-photo"></i>
                {% endif %}
                <i class="mini-head"></i>
                <i class="mini-side"></i>
                <i class="mini-line a"></i>
                <i class="mini-line b"></i>
                <i class="mini-line c"></i>
                <i class="mini-line d"></i>
              </span>
              <strong>{{ template.name }}</strong>
              <small>{{ template.layout }} · {{ template.skill_style }}</small>
            </button>
            {% endfor %}
          </div>
        </section>

        <form id="resumeForm" class="resume-form">
          <section>
            <div class="section-title-row">
              <h2>Section order</h2>
              <span id="saveStatus">Autosaved</span>
            </div>
            <div id="sectionOrder" class="section-order">
              <button type="button" data-section="summary">Summary</button>
              <button type="button" data-section="skills">Skills</button>
              <button type="button" data-section="experience">Experience</button>
              <button type="button" data-section="projects">Projects</button>
              <button type="button" data-section="education">Education</button>
              <button type="button" data-section="certifications">Certifications</button>
            </div>
          </section>

          <section>
            <h2>Personal</h2>
            <div class="grid two">
              <input id="fullName" required placeholder="Full name" value="Alex Morgan">
              <input id="title" placeholder="Professional title" value="Full Stack Developer">
              <input id="email" type="email" required placeholder="Email" value="alex@example.com">
              <input id="phone" required placeholder="Phone" value="+1 555 010 2288">
              <input id="location" placeholder="Location" value="Austin, TX">
              <input id="linkedin" placeholder="LinkedIn" value="linkedin.com/in/alexmorgan">
              <input id="portfolio" placeholder="Portfolio" value="alexmorgan.dev">
            </div>
            <label class="upload-box">
              Profile image
              <input id="profileImage" type="file" accept="image/*">
              <span id="profileImageName">Used by image-ready templates</span>
            </label>
            <textarea id="summary" rows="4" placeholder="Professional summary">Full stack developer with 5+ years of experience building reliable web applications, REST APIs, and accessible user interfaces for SaaS teams.</textarea>
          </section>

          <section>
            <h2>Skills</h2>
            <textarea id="skills" rows="3" placeholder="Comma-separated skills">Python, FastAPI, JavaScript, React, SQL, REST APIs, Docker, Accessibility, Testing</textarea>
          </section>

          <section>
            <h2>Experience</h2>
            <div id="experienceList" class="stack"></div>
            <button class="secondary-btn" type="button" data-add="experience">Add experience</button>
          </section>

          <section>
            <h2>Projects</h2>
            <div id="projectList" class="stack"></div>
            <button class="secondary-btn" type="button" data-add="project">Add project</button>
          </section>

          <section>
            <h2>Education</h2>
            <div id="educationList" class="stack"></div>
            <button class="secondary-btn" type="button" data-add="education">Add education</button>
          </section>

          <section>
            <h2>Certifications</h2>
            <div id="certificationList" class="stack"></div>
            <button class="secondary-btn" type="button" data-add="certification">Add certification</button>
          </section>
        </form>
      </aside>

      <section class="preview-area">
        <div class="score-strip">
          <strong id="atsScore">ATS 0</strong>
          <span id="atsHints">Complete the form to see optimization hints.</span>
          <label class="zoom-control">
            Zoom
            <input id="previewZoom" type="range" min="70" max="120" value="100">
          </label>
        </div>
        <div id="keywordPanel" class="keyword-panel"></div>
        <div id="preview" class="preview-frame"></div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
